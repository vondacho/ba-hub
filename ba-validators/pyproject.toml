[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bacm"
version = "0.1.0"
description = "Validators for ba-cm's context maps and domain models: .ddd, .ddm and their view sidecars."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Olivier von Dach" }]
keywords = ["domain-driven-design", "ddd", "context-map", "bounded-context", "dsl"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
# Deliberately none. ba-cm's own parsers depend on nothing but their runtime,
# and a validator that has to be installed before a CI job can read a context
# map is a validator nobody runs.
dependencies = []

[project.scripts]
bacm-validate = "bacm.cli:main"

[tool.setuptools.packages.find]
include = ["bacm*"]

[tool.ruff]
line-length = 100
target-version = "py310"
