{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ba-ddd-mapper.serviceAccountName" . }}
  labels:
    {{- include "ba-ddd-mapper.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The mapper does not talk to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
