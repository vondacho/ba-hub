apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ba-portal.fullname" . }}
  labels:
    {{- include "ba-portal.labels" . | nindent 4 }}
data:
  # Read by src/lib/links.ts through process.env at call time. Every entry here
  # is a **browser-facing link** — the visitor's browser resolves them, so an
  # in-cluster address would be wrong, and each of these but the mapper names a
  # release in another namespace, where it would also be impossible.
  #
  # The prerendered pages under /doc/* cannot read any of them; they link to
  # /go/<target> instead, which is server-rendered and resolves the value per
  # request. See src/pages/go/[target].ts.
  ARCH_PORTAL_URL: {{ .Values.app.archPortalUrl | quote }}
  API_PORTAL_URL: {{ .Values.app.apiPortalUrl | quote }}
  DEV_PORTAL_URL: {{ .Values.app.devPortalUrl | quote }}
  QA_PORTAL_URL: {{ .Values.app.qaPortalUrl | quote }}
  EVENT_STORMER_URL: {{ .Values.app.eventStormerUrl | quote }}

  # ba-ddd-mapper is a release in this same namespace, and this is still its
  # ingress host rather than http://ba-ddd-mapper:4322: the visitor's browser is
  # what follows the link. Nothing in this portal calls the mapper from the
  # server, so there is no second entry the way doc-portal needs one for its
  # registry.
  DDD_MAPPER_URL: {{ .Values.app.dddMapperUrl | quote }}

  # Nothing is deployed behind this one yet. Rendered unconditionally so that
  # pointing it somewhere is a value change rather than a template change.
  LANDSCAPE_API_URL: {{ .Values.app.landscapeApiUrl | quote }}
  {{- range $key, $value := .Values.app.extraConfig }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
