# Runtime definition for the ba-hub Docker host (/opt/ba-hub).
#
# Shipped by the `deploy` job in .github/workflows/build-images.yml, which
# rsyncs this directory and then runs `docker compose pull && up -d`. Editing
# it is a git push — the instance itself never needs to be replaced.
#
# ACME_EMAIL comes from /opt/ba-hub/.env, written by iac/user-data.sh.

name: ba-hub

services:
  # The only service bound to the host. Both apps are reachable exclusively
  # through it, so there is no way to hit them over plain HTTP.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in /opt/ba-hub/.env}
    volumes:
      # The *directory*, not caddy/Caddyfile itself. A single-file bind mount
      # resolves to that file's inode, and deploy.sh unpacks with `tar -x`,
      # which replaces the file rather than rewriting it — the container would
      # stay pinned to the copy that existed when it was created and never see
      # another edit. Mounting the directory makes the path the mount, so a
      # replaced file is picked up and `caddy reload` has something to reload.
      - ./caddy:/etc/caddy:ro
      # Certificates and ACME account keys. Losing this volume means
      # re-issuing from scratch, which is how you meet Let's Encrypt's
      # duplicate-certificate rate limit.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      ba-portal:
        condition: service_healthy
      ba-cm:
        condition: service_healthy

  ba-portal:
    image: ghcr.io/vondacho/ba-hub/ba-portal:latest
    restart: unless-stopped
    # No `ports`: reachable on the compose network only.
    expose:
      - "4321"
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      NODE_ENV: production
      # Resolved per request by src/lib/links.ts — this is what the browser
      # gets in the rendered links, so it must be the public URL. Every entry
      # the chart's ConfigMap carries has to be here too: an unset one falls
      # back to the .localhost default in src/lib/links.ts, which is a link no
      # visitor of this host can follow.
      CONTEXT_MAPPER_URL: https://ba-cm.obya.ch
      # doc-hub's event storming board, and the one neighbour that is deployed
      # today — the footer, the tools page and /go/stormer all point at it.
      EVENT_STORMER_URL: https://doc-es.obya.ch
      # The neighbouring hubs. These resolve only once those hubs are deployed,
      # and until then they are dead links on the right host names — which is
      # the trade the tools page's `planned` badges already describe. A
      # .localhost default could never resolve at all.
      ARCH_PORTAL_URL: https://arch-portal.obya.ch
      API_PORTAL_URL: https://api-portal.obya.ch
      DEV_PORTAL_URL: https://dev-portal.obya.ch
      QA_PORTAL_URL: https://qa-portal.obya.ch
      # Nothing is deployed behind the landscape collector yet. Named anyway,
      # for the same reason the chart renders it unconditionally: pointing it
      # somewhere becomes a value change rather than a template change.
      LANDSCAPE_API_URL: https://landscape-api.obya.ch
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4321/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  ba-cm:
    image: ghcr.io/vondacho/ba-hub/ba-cm:latest
    restart: unless-stopped
    expose:
      - "4322"
    environment:
      HOST: 0.0.0.0
      PORT: 4322
      NODE_ENV: production
      # Browser-facing, all three. BA_PORTAL_URL has a second job: the assistant
      # panel builds the prompt library's address from it,
      # <BA_PORTAL_URL>/doc/tooling/prompts/.
      BA_PORTAL_URL: https://ba-portal.obya.ch
      EVENT_STORMER_URL: https://doc-es.obya.ch
      ARCH_PORTAL_URL: https://arch-portal.obya.ch
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4322/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  caddy_data:
  caddy_config:
